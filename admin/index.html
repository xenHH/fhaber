<script>
const TYPES={paper:['İnşaat ve Yıkıntı atıkları','--paper'],plastic:['Tekstil Suyu ve Mikroplastikler','--plastic'],glass:['Elektronik Atıklar','--glass'],metal:['Sanayi ve Endüstriyel Atıklar','--metal'],organic:['Evsel Atıklar','--organic'],hazard:['Tehlikeli Atıklar','--hazard'],medical:['Tıbbi Atıklar','--medical']};

let N=[
{id:'haber-1', t:'organic', h:'Buraya haber konacak', s:'Haber özeti buraya eklenecek.', img:'', text:'Haber detayı buraya eklenecek.'},
{id:'haber-2', t:'plastic', h:'Buraya haber konacak', s:'Haber özeti buraya eklenecek.', img:'', text:'Haber detayı buraya eklenecek.'},
{id:'haber-3', t:'hazard', h:'Buraya haber konacak', s:'Haber özeti buraya eklenecek.', img:'', text:'Haber detayı buraya eklenecek.'},
{id:'haber-4', t:'metal', h:'Buraya haber konacak', s:'Haber özeti buraya eklenecek.', img:'', text:'Haber detayı buraya eklenecek.'},
{id:'haber-5', t:'glass', h:'Buraya haber konacak', s:'Haber özeti buraya eklenecek.', img:'', text:'Haber detayı buraya eklenecek.'},
{id:'tv-1', t:'organic', h:'TV Haberi Buraya Konacak', s:'Haber özeti buraya eklenecek.', img:'', text:'Haber detayı buraya eklenecek.'},
{id:'tv-2', t:'plastic', h:'TV Haberi Buraya Konacak', s:'Haber özeti buraya eklenecek.', img:'', text:'Haber detayı buraya eklenecek.'},
{id:'tv-3', t:'hazard', h:'TV Haberi Buraya Konacak', s:'Haber özeti buraya eklenecek.', img:'', text:'Haber detayı buraya eklenecek.'},
{id:'gazete-1', t:'paper', h:'Gazete Haberi Buraya Konacak', s:'Haber özeti buraya eklenecek.', img:'', text:'Haber detayı buraya eklenecek.'},
{id:'gazete-2', t:'plastic', h:'Gazete Haberi Buraya Konacak', s:'Haber özeti buraya eklenecek.', img:'', text:'Haber detayı buraya eklenecek.'},
{id:'gazete-3', t:'metal', h:'Gazete Haberi Buraya Konacak', s:'Haber özeti buraya eklenecek.', img:'', text:'Haber detayı buraya eklenecek.'},
{id:'roportaj-1', t:'organic', h:'Röportaj Buraya Konacak', s:'Röportaj özeti buraya eklenecek.', img:'', text:'Röportaj detayı buraya eklenecek.'},
{id:'roportaj-2', t:'glass', h:'Röportaj Buraya Konacak', s:'Röportaj özeti buraya eklenecek.', img:'', text:'Röportaj detayı buraya eklenecek.'},
{id:'roportaj-3', t:'medical', h:'Röportaj Buraya Konacak', s:'Röportaj özeti buraya eklenecek.', img:'', text:'Röportaj detayı buraya eklenecek.'},
{id:'podcast-1', t:'hazard', h:'Podcast Buraya Konacak', s:'Podcast özeti buraya eklenecek.', img:'', text:'Podcast detayı buraya eklenecek.'},
{id:'podcast-2', t:'paper', h:'Podcast Buraya Konacak', s:'Podcast özeti buraya eklenecek.', img:'', text:'Podcast detayı buraya eklenecek.'},
{id:'podcast-3', t:'plastic', h:'Podcast Buraya Konacak', s:'Podcast özeti buraya eklenecek.', img:'', text:'Podcast detayı buraya eklenecek.'}
];

const $=s=>document.querySelector(s),root=document.documentElement;
const bin=(c,k)=>{const ic=k=='medical'?'<path d="M29 41h6v5h5v6h-5v5h-6v-5h-5v-6h5z" fill="#e11d3c"/>':k=='hazard'?'<rect x="30" y="40" width="4" height="12" fill="#111"/><rect x="30" y="55" width="4" height="4" fill="#111"/>':'<path d="M32 41l9 15H23z" fill="none" stroke="#111" stroke-width="2.4" stroke-linejoin="round"/>';
return `<svg viewBox="0 0 64 92"><ellipse cx="32" cy="88" rx="26" ry="3" fill="#000" opacity=".4"/><rect x="14" y="7" width="36" height="6" fill="${c}"/><rect x="14" y="7" width="36" height="6" fill="#0005"/><polygon points="9,22 55,22 50,81 14,81" fill="${c}"/><polygon points="34,22 55,22 50,81 34,81" fill="#0003"/><polygon points="9,22 15,22 19,81 14,81" fill="#fff" opacity=".25"/><path d="M22 24l2 56M42 24l-2 56" stroke="#0004" stroke-width="1.5"/><rect x="21" y="35" width="22" height="30" fill="#f4f4f0"/>${ic}<rect x="4" y="12" width="56" height="11" fill="${c}"/><rect x="4" y="12" width="56" height="3" fill="#fff" opacity=".35"/><rect x="4" y="20" width="56" height="3" fill="#000" opacity=".3"/><rect x="21" y="16" width="22" height="3" fill="#000" opacity=".5"/><rect x="12" y="78" width="40" height="4" fill="#000" opacity=".35"/><circle cx="18" cy="84" r="4.5" fill="#111"/><circle cx="18" cy="84" r="1.8" fill="#777"/><circle cx="46" cy="84" r="4.5" fill="#111"/><circle cx="46" cy="84" r="1.8" fill="#777"/></svg>`};

function drawBins(){const h=Object.entries(TYPES).map(([k,v])=>bin(`var(${v[1]})`,k));$('#bb').innerHTML=[...h,...h].join('')}
let heroIndex=0,timer=null;

const card=(n,hero)=>`<div class="card ${hero?'hero':''}" data-id="${n.id}" style="--c:var(${TYPES[n.t][1]})">${hero?'<span class="tag">Manşet Haber</span>':''}${hero && n.img ?`<img src="${n.img}" class="hero-img">`:''}<h3 class="ed">${n.h}</h3><p>${n.s}</p><span class="more">HABERİ OKU →</span></div>`;

function render(){
  let html=`${card(N[heroIndex],true)}
            <h2 class="slider-title ed">Tüm Haberler</h2>
            <div class="news-slider">`;
  
  for(let i=0; i<N.length; i++){
    if(i !== heroIndex) html += card(N[i], false);
  }
  
  html+='</div>';
  $('#app').innerHTML=html;

  document.querySelectorAll('.card').forEach(cardEl => {
    cardEl.onclick = () => {
      const id = cardEl.dataset.id;
      const selectedNews = N.find(item => item.id === id);
      localStorage.setItem('fh-current-news', JSON.stringify(selectedNews));
      window.location.href = 'f_haber_detay_sayfas.html';
    };
  });
}

function startTimer(){
  clearInterval(timer);
  if(N.length<2)return;
  timer=setInterval(()=>{
    // Fare slider'ın üstündeyken manşet değişmesin (kaydırma sıfırlanmasın)
    if($('.news-slider:hover')) return;
    let next;
    do { next=Math.floor(Math.random()*N.length); } while(next===heroIndex);
    heroIndex=next;
    render();
  },5000);
}

const DEF={'--bg':'#ffffff','--surface':'#eef3f0','--accent':'#0e8a5f','--paper':'#1d6fe0','--plastic':'#f5c400','--glass':'#14a44d','--metal':'#8a949c','--organic':'#8a5a2b','--hazard':'#d9262c','--medical':'#e11d74'};
const LBL={'--bg':'Arka plan','--surface':'Kart zemini','--accent':'Ana yeşil','--paper':'Kağıt','--plastic':'Plastik','--glass':'Cam','--metal':'Metal','--organic':'Organik','--hazard':'Tehlikeli','--medical':'Tıbbi'};
let cur={...DEF};try{Object.assign(cur,JSON.parse(localStorage.getItem('fh-c2')||'{}'))}catch(e){}
function apply(){for(const k in cur)root.style.setProperty(k,cur[k])}
function panel(){$('#pn').innerHTML=Object.keys(DEF).map(k=>`<label>${LBL[k]}<input type="color" data-k="${k}" value="${cur[k]}"></label>`).join('')+'<button id="rs">SIFIRLA</button>';}
$('#pn').addEventListener('input',e=>{const k=e.target.dataset.k;if(!k)return;cur[k]=e.target.value;apply();try{localStorage.setItem('fh-c2',JSON.stringify(cur))}catch(_){}});
$('#pn').addEventListener('click',e=>{if(e.target.id=='rs'){cur={...DEF};apply();panel();try{localStorage.removeItem('fh-c2')}catch(_){}}});

$('#tg').onclick=()=>$('#pn').classList.toggle('open');
$('#ft').innerHTML=Object.values(TYPES).map(v=>`<li><span class="sw" style="--c:var(${v[1]})"></span>${v[0]}</li>`).join('');
// Slider üzerinde fare tekerleği ile yatay kaydırma
let snapT;
$('#app').addEventListener('wheel',e=>{
  const s=e.target.closest('.news-slider');
  if(!s) return;
  const max=s.scrollWidth-s.clientWidth;
  if(max<=0) return;
  const d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;
  // Başta veya sondaysa sayfanın normal kaydırmasına izin ver
  if((d<0&&s.scrollLeft<=0)||(d>0&&s.scrollLeft>=max-1)) return;
  e.preventDefault();
  s.style.scrollSnapType='none';   // kaydırma sırasında snap'i kapat
  s.scrollLeft+=d;
  clearTimeout(snapT);
  snapT=setTimeout(()=>{s.style.scrollSnapType='';},150); // durunca en yakın karta otursun
},{passive:false});
apply(); panel(); drawBins(); render(); startTimer();

// Decap CMS haberleri: orijinal ana sayfa düzenini koruyarak yükle.
async function loadCmsHomepage(){
  try {
    const response=await fetch('https://api.github.com/repos/xenHH/fhaber/contents/haberler?ref=main');
    if(!response.ok)throw new Error('Haber listesi yüklenemedi: '+response.status);
    const files=(await response.json()).filter(f=>f.name.endsWith('.md'));
    const loaded=await Promise.all(files.map(async file=>{
      try {
        const r=await fetch(file.download_url);
        if(!r.ok) return null;
        const raw=await r.text();
        const match=raw.match(/^---\s*\r?\n([\s\S]*?)\r?\n---\s*\r?\n?/);
        if(!match||!window.jsyaml)return null;
        const data=jsyaml.load(match[1])||{};
        const category=String(data.category||'').toLocaleLowerCase('tr-TR');
        const categoryMap={'gündem':'organic','ekonomi':'metal','spor':'plastic','teknoloji':'glass','dünya':'paper','tıbbi atıklar':'medical','sanayi ve endüstriyel atıklar':'metal'};
        const image=String(data.image||'');
        const img=/^https?:\/\//.test(image)||image.startsWith('/')?image:('/fhaber/'+image.replace(/^\.\//,''));
        return {id:file.name.replace(/\.md$/i,''),t:categoryMap[category]||'organic',h:String(data.title||'Başlıksız Haber'),s:String(data.spot||''),img:image?img:'',text:raw.slice(match[0].length),date:String(data.date||''),category:String(data.category||''),imgs:Array.isArray(data.gallery)?data.gallery:[]};
      }catch(e){console.warn('Haber okunamadı',file.name,e);return null;}
    }));
    const news=loaded.filter(Boolean).sort((a,b)=>new Date(b.date||0)-new Date(a.date||0));
    if(news.length){N=news;heroIndex=0;render();startTimer();}
    else {console.info('CMS üzerinde henüz haber yok; örnek tasarım korunuyor.');}
  }catch(e){console.warn('CMS yüklenemedi, orijinal tasarım gösteriliyor.',e);}
}
loadCmsHomepage();
</script>
