backend:
  name: turbo-github
  turbo_site_id: a8069704-9018-4134-bfd2-5f163d46735d

media_folder: "images/uploads"
public_folder: "/fhaber/images/uploads"

collections:
  - name: "haberler"
    label: "Haberler"
    folder: "haberler"
    create: true
    slug: "{{slug}}"

    fields:
      - label: "Haber Başlığı"
        name: "title"
        widget: "string"

      - label: "Spot"
        name: "spot"
        widget: "text"

      - label: "Yayın Türü"
        name: "section"
        widget: "select"
        options:
          - {label: "Gazete Haberi", value: "gazete"}
          - {label: "TV Haberi", value: "tv"}
          - {label: "Röportaj", value: "roportaj"}
          - {label: "Foto Röportaj", value: "foto_roportaj"}
          - {label: "Podcast", value: "podcast"}

      - label: "Atık Kategorisi"
        name: "category"
        widget: "select"
        options:
          - {label: "İnşaat ve Yıkıntı Atıkları", value: "paper"}
          - {label: "Tekstil Suyu ve Mikroplastikler", value: "plastic"}
          - {label: "Elektronik Atıklar", value: "glass"}
          - {label: "Sanayi ve Endüstriyel Atıklar", value: "metal"}
          - {label: "Evsel Atıklar", value: "organic"}
          - {label: "Tehlikeli Atıklar", value: "hazard"}
          - {label: "Tıbbi Atıklar", value: "medical"}
          - {label: "Sıfır Atık", value: "zero_waste"}

      - label: "Haber Fotoğrafı"
        name: "image"
        widget: "image"
        required: false

      - label: "Kapak Fotoğrafı Altyazısı"
        name: "image_caption"
        widget: "string"
        required: false
        hint: "Kapak fotoğrafının altında gösterilecek açıklamayı yazın."

      - label: "Fotoğraf Galerisi"
        name: "gallery"
        widget: "list"
        required: false
        field:
          label: "Fotoğraf"
          name: "image"
          widget: "image"

      - label: "Altyazılı Fotoğraf Galerisi"
        name: "captioned_gallery"
        widget: "list"
        required: false
        fields:
          - label: "Fotoğraf"
            name: "image"
            widget: "image"

          - label: "Fotoğraf Altyazısı"
            name: "caption"
            widget: "string"
            required: false

      - label: "YouTube Video Bağlantısı"
        name: "youtube"
        widget: "string"
        required: false

      - label: "Haber Metni"
        name: "body"
        widget: "markdown"
        editor_components:
          - image
          - code-block
          - captioned-image
        hint: "Metin içerisinde açıklamalı fotoğraf kullanmak için Altyazılı Fotoğraf seçeneğini seçin."
