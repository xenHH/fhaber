
backend:
  name: turbo-github
  turbo_site_id: a8069704-9018-4134-bfd2-5f163d46735d

media_folder: "images/uploads"
public_folder: "/fhaber/images/uploads"

collections:
  - name: "haberler"
    label: "Haberler"
    folder: "haberler"
    create: true
    slug: "{{slug}}"

    fields:
      - label: "Haber Başlığı"
        name: "title"
        widget: "string"

      - label: "Spot"
        name: "spot"
        widget: "text"

      - label: "Yayın Türü"
        name: "section"
        widget: "select"
        options:
          - {label: "Gazete Haberi", value: "gazete"}
          - {label: "TV Haberi", value: "tv"}
          - {label: "Röportaj", value: "roportaj"}
          - {label: "Podcast", value: "podcast"}

      - label: "Kategori"
        name: "category"
        widget: "select"
        options:
          - {label: "İnşaat ve Yıkıntı Atıkları", value: "paper"}
          - {label: "Tekstil Suyu ve Mikroplastikler", value: "plastic"}
          - {label: "Elektronik Atıklar", value: "glass"}
          - {label: "Sanayi ve Endüstriyel Atıklar", value: "metal"}
          - {label: "Evsel Atıklar", value: "organic"}
          - {label: "Tehlikeli Atıklar", value: "hazard"}
          - {label: "Tıbbi Atıklar", value: "medical"}

      - label: "Kapak Fotoğrafı"
        name: "image"
        widget: "image"
        required: false

      - label: "Fotoğraf Galerisi"
        name: "gallery"
        widget: "list"
        required: false
        field:
          label: "Fotoğraf"
          name: "image"
          widget: "image"

      - label: "Haber Metni"
        name: "body"
        widget: "markdown"
