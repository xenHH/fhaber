backend:
  name: turbo-github
  turbo_site_id: a8069704-9018-4134-bfd2-5f163d46735d
media_folder: "images/uploads"
public_folder: "/fhaber/images/uploads"
collections:
  - name: "haberler"
    label: "Haberler"
    folder: "haberler"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Haber Başlığı", name: "title", widget: "string"}
      - {label: "Spot", name: "spot", widget: "text"}
      - label: "Yayın Türü"
        name: "section"
        widget: "select"
        options:
          - {label: "Gazete Haberi", value: "gazete"}
          - {label: "TV Haberi", value: "tv"}
          - {label: "Röportaj", value: "roportaj"}
          - {label: "Podcast", value: "podcast"}
      - label: "Kategori"
        name: "category"
        widget: "select"
        options: ["Gündem", "Ekonomi", "Spor", "Teknoloji", "Dünya", "Çevre"]
      - {label: "Kapak Fotoğrafı", name: "image", widget: "image", required: false}
      - {label: "Yayın Tarihi", name: "date", widget: "datetime"}
      - {label: "Yazar", name: "author", widget: "string", required: false}
      - label: "Haber Galerisi"
        name: "gallery"
        widget: "list"
        required: false
        field: {label: "Fotoğraf", name: "image", widget: "image"}
      - {label: "Haber Metni", name: "body", widget: "markdown"}
