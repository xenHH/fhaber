name: F Haber - Siteyi yayinla
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/configure-pages@v5
      - name: Haber listesini olustur
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          items = []
          for p in sorted(Path('haberler').iterdir()):
              if not p.is_file() or p.suffix.lower() != '.md':
                  continue
              date = subprocess.check_output(['git', 'log', '-1', '--format=%cI', '--', str(p)], text=True).strip()
              items.append({'name': p.name, 'raw': p.read_text(encoding='utf-8-sig'), 'date': date})
          Path('haberler.json').write_text(json.dumps(items, ensure_ascii=False), encoding='utf-8')
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Siteyi yayinla
        id: deployment
        uses: actions/deploy-pages@v4
